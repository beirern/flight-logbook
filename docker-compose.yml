services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ${IMAGE:-flight-logbook:local}
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          host = os.environ.get('ALLOWED_HOSTS', 'localhost').split(',')[0].strip().lstrip('.') or 'localhost';
          host = 'localhost' if host == '*' else host;
          request = urllib.request.Request('http://127.0.0.1:8080/admin/login/', headers={'Host': host});
          response = urllib.request.urlopen(request, timeout=5);
          assert response.status == 200
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
